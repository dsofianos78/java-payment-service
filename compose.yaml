# Local infrastructure for ./mvnw spring-boot:run. Spring Boot starts it automatically
# and stops it on shutdown; the named volume keeps the data between restarts.
# Example credentials for local containers only.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432"
    volumes:
      - payments-data:/var/lib/postgresql

  # A stand-in for the external account, authorization and limit systems, serving the
  # fictional data in wiremock/mappings. Unknown accounts get WireMock's default 404.
  account-system:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro

  # Scrapes the running app's /actuator/prometheus every 5s (observability/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # http://localhost:3000, anonymous admin, Prometheus already set up as the data source. Local use only.
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro

volumes:
  payments-data:
