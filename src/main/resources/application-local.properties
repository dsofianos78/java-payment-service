# Only with the local profile: ./mvnw spring-boot:run and docker compose --profile app turn it on.
# Tokens are signed with this shared key (HS256), so no identity provider has to run. An example value for local
# use only. A deployment never turns this profile on: it sets spring.security.oauth2.resourceserver.jwt.issuer-uri
# instead, and without either the service doesn't start, rather than accepting tokens signed with a published key.
payment.security.local-jwt-secret=local-only-example-key-not-a-real-secret-0001

# Every trace is kept locally (docs/episodes/bonus-05): one request is all there is to look at.
management.tracing.sampling.probability=1.0
