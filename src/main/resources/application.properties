spring.application.name=payment-service

# Schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The external account system. Locally this is the WireMock container in compose.yaml
# serving the fictional accounts in wiremock/mappings. Example value only.
account-system.url=http://localhost:8089
