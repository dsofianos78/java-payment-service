# The local environment. Two ways to use it:
#   ./mvnw spring-boot:run            Spring Boot starts the infrastructure below and the service runs on the host.
#   docker compose --profile app up   the service runs in a container too, configured only by environment variables.
# The named volume keeps the data between restarts. Every credential and address here is an example for local
# containers only. Nothing points at a real system.
services:
  payment-service:
    profiles: [app]
    build: .
    # Like a container platform: a service that dies at start-up (Kafka not up yet) is started again.
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Accepts tokens signed with the local key (application-local.properties). A real deployment sets
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI instead.
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_SYSTEM_URL: http://account-system:8080
      AUTHORIZATION_SYSTEM_URL: http://account-system:8080
      LIMIT_SYSTEM_URL: http://account-system:8080
      PAYMENT_SYSTEM_URL: http://account-system:8080
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      account-system:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432"
    volumes:
      - payments-data:/var/lib/postgresql
    # Flyway migrates at start-up, so the service waits until PostgreSQL accepts connections.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payments", "-d", "payments"]
      interval: 2s
      retries: 15

  # A stand-in for the external account, authorization, limit and payment systems, serving the
  # fictional data in wiremock/mappings. Unknown accounts get WireMock's default 404.
  account-system:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro

  # The message broker for asynchronous processing (docs/episodes/17). A single node, no replication:
  # local use only. Spring Boot has no Docker Compose connection for Kafka, so it uses a fixed port,
  # localhost:9092, which is also Spring's default bootstrap server.
  # A broker tells clients which address to reconnect to, so it needs one listener per network:
  # localhost:9092 for the service on the host, kafka:19092 for the service in a container.
  # Setting any KAFKA_ variable replaces the image's whole default configuration, hence the full list.
  kafka:
    image: apache/kafka-native:4.1.1
    # The native image's start-up very occasionally segfaults (seen once in about 20 starts). Start it again.
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Scrapes the running service's /actuator/prometheus every 5s (observability/prometheus.yml), in its
  # container or on the host.
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # http://localhost:3000, anonymous admin, Prometheus already set up as the data source. Local use only.
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro

volumes:
  payments-data:
